<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: white;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .stats {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .card.flipped {
            background: rgba(255, 255, 255, 0.95);
            border-color: white;
            transform: rotateY(180deg);
        }
        .card.matched {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4CAF50;
            cursor: default;
            animation: pulse 0.5s;
        }
        .card-back {
            position: absolute;
            backface-visibility: hidden;
        }
        .card-front {
            position: absolute;
            backface-visibility: hidden;
            transform: rotateY(180deg);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .reset-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .reset-btn:hover {
            background: white;
            color: #667eea;
            transform: scale(1.05);
        }
        .victory {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            transition: transform 0.3s;
            z-index: 1000;
        }
        .victory.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .victory h2 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 Memory Match</h1>
        <div class="stats">
            <div>이동: <span id="moves">0</span></div>
            <div>매치: <span id="matches">0</span> / 8</div>
            <div>시간: <span id="timer">0</span>초</div>
        </div>
    </div>
    
    <div class="game-grid" id="gameGrid"></div>
    
    <button class="reset-btn" onclick="resetGame()">새 게임</button>

    <div class="victory" id="victory">
        <h2>🎉 성공!</h2>
        <p id="finalStats"></p>
        <button class="reset-btn" onclick="resetGame()">다시 하기</button>
    </div>

    <script>
        const emojis = ['🎮', '🎯', '🎨', '🎭', '🎪', '🎸', '🎺', '🎹'];
        let cards = [...emojis, ...emojis];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createCard(emoji, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.emoji = emoji;
            card.dataset.index = index;
            card.innerHTML = `
                <div class="card-back">🧠</div>
                <div class="card-front">${emoji}</div>
            `;
            card.onclick = () => flipCard(card);
            return card;
        }

        function flipCard(card) {
            if (flippedCards.length >= 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }

            if (flippedCards.length === 0 && !timerInterval) {
                startTimer();
            }

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.emoji === card2.dataset.emoji;

            setTimeout(() => {
                if (match) {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    document.getElementById('matches').textContent = matchedPairs;
                    
                    if (matchedPairs === 8) {
                        endGame();
                    }
                } else {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                }
                flippedCards = [];
            }, 800);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').textContent = timer;
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('finalStats').textContent = 
                `${moves}번의 이동으로 ${timer}초 만에 완료!`;
            document.getElementById('victory').classList.add('show');
        }

        function resetGame() {
            clearInterval(timerInterval);
            timerInterval = null;
            timer = 0;
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            document.getElementById('timer').textContent = '0';
            document.getElementById('moves').textContent = '0';
            document.getElementById('matches').textContent = '0';
            document.getElementById('victory').classList.remove('show');
            initGame();
        }

        function initGame() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            const shuffledCards = shuffle([...cards]);
            shuffledCards.forEach((emoji, index) => {
                grid.appendChild(createCard(emoji, index));
            });
        }

        initGame();
    </script>
</body>
</html>
